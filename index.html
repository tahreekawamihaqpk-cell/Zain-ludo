<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#0b3d2e;overflow:hidden;font-family:sans-serif}
#b{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
padding:14px 36px;font-size:22px;border:0;border-radius:30px;background:#ffd23f}
#r{position:fixed;top:20px;width:100%;text-align:center;color:#fff;font-size:30px}
</style></head><body>
<div id="r"></div><button id="b">Roll 🎲</button>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);
cam.position.set(0,0,6);
const ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
ren.setSize(innerWidth,innerHeight);
document.body.appendChild(ren.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.8));
const sun=new THREE.DirectionalLight(0xffffff,1);
sun.position.set(3,5,6);scene.add(sun);

const P={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function face(n){
  const c=document.createElement("canvas");c.width=c.height=256;
  const g=c.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,256,256);
  g.fillStyle=n===1?"#d62828":"#111";
  P[n].forEach(i=>{g.beginPath();
    g.arc(64+(i%3)*64,64+Math.floor(i/3)*64,22,0,7);g.fill();});
  return new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(c)});
}
// ترتیب: +x,-x,+y,-y,+z,-z
const dice=new THREE.Mesh(new THREE.BoxGeometry(2,2,2),
  [3,4,1,6,2,5].map(face));
scene.add(dice);

const T=Math.PI/2;
const base={1:[T,0,0],2:[0,0,0],3:[0,-T,0],4:[0,T,0],5:[0,Math.PI,0],6:[-T,0,0]};
let anim=null;
const out=document.getElementById("r");

document.getElementById("b").onclick=()=>{
  if(anim)return;
  const n=1+Math.floor(Math.random()*6);
  const s=[dice.rotation.x,dice.rotation.y,dice.rotation.z];
  const e=base[n].map(v=>v+Math.PI*2*(2+Math.floor(Math.random()*3)));
  anim={n,s,e,t:0};out.textContent="";
};

function loop(){
  requestAnimationFrame(loop);
  if(anim){
    anim.t+=0.018;
    const k=Math.min(anim.t,1),f=1-Math.pow(1-k,3);
    dice.rotation.set(
      anim.s[0]+(anim.e[0]-anim.s[0])*f,
      anim.s[1]+(anim.e[1]-anim.s[1])*f,
      anim.s[2]+(anim.e[2]-anim.s[2])*f);
    dice.position.y=Math.abs(Math.sin(k*Math.PI*3))*(1-k)*2;
    if(k>=1){out.textContent="🎲 "+anim.n;anim=null;}
  }
  ren.render(scene,cam);
}
loop();
</script></body></html>
